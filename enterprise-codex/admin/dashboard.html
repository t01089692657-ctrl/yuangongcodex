<title>Codex Platform — Admin</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --line:#e5e5e5; --bar:#3b82f6; --card:#fafafa; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f1115; --fg:#e8e8e8; --muted:#9aa0aa; --line:#242833; --bar:#60a5fa; --card:#161922; } }
  body{ font:14px/1.5 system-ui,sans-serif; margin:0; background:var(--bg); color:var(--fg); }
  header{ padding:20px 24px; border-bottom:1px solid var(--line); display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1{ font-size:18px; margin:0; }
  main{ padding:24px; max-width:900px; margin:0 auto; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:20px; }
  table{ width:100%; border-collapse:collapse; }
  th,td{ text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th{ color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .bar{ height:8px; background:var(--bar); border-radius:4px; }
  .muted{ color:var(--muted); }
  .pill{ font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); }
  .off{ opacity:.5; }
  input,button{ font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  button{ cursor:pointer; }
</style>
<header>
  <h1>Codex Platform · Admin</h1>
  <span class="muted">token usage & offboarding</span>
  <span style="flex:1"></span>
  <input id="tok" placeholder="admin token" value="admin-dev-token" size="18">
  <button onclick="load()">Refresh</button>
</header>
<main>
  <div class="card">
    <h3 style="margin-top:0">Usage leaderboard</h3>
    <table><thead><tr><th>#</th><th>Employee</th><th>Status</th><th>Requests</th><th>Total tokens</th><th></th></tr></thead>
    <tbody id="rows"><tr><td colspan="6" class="muted">Enter admin token and Refresh…</td></tr></tbody></table>
  </div>
  <div class="card">
    <h3 style="margin-top:0">Offboard (instant cutoff)</h3>
    <input id="email" placeholder="employee@corp.com" size="24">
    <button onclick="revoke()">Revoke access</button>
    <span id="revmsg" class="muted"></span>
  </div>
</main>
<script>
  const tok = () => document.getElementById('tok').value.trim();
  async function api(pathname, opts={}){
    const r = await fetch(pathname, { ...opts, headers: { authorization: 'Bearer '+tok(), 'content-type':'application/json', ...(opts.headers||{}) } });
    if(!r.ok) throw new Error(await r.text());
    return r.json();
  }
  async function load(){
    try{
      const [lb, u] = await Promise.all([ api('/admin/leaderboard'), api('/admin/usage') ]);
      const statusOf = Object.fromEntries(u.employees.map(e => [e.email, e.status]));
      const max = Math.max(1, ...lb.leaderboard.map(r => r.totalTokens));
      const tbody = document.getElementById('rows');
      tbody.innerHTML = lb.leaderboard.length ? lb.leaderboard.map((r,i) => {
        const st = statusOf[r.email] || 'active';
        return `<tr class="${st==='active'?'':'off'}">
          <td>${i+1}</td><td>${r.email}</td>
          <td><span class="pill">${st}</span></td>
          <td>${r.requests}</td><td>${r.totalTokens.toLocaleString()}</td>
          <td style="width:180px"><div class="bar" style="width:${Math.round(100*r.totalTokens/max)}%"></div></td>
        </tr>`; }).join('') : '<tr><td colspan="6" class="muted">No usage yet.</td></tr>';
    }catch(e){ document.getElementById('rows').innerHTML = '<tr><td colspan="6" class="muted">'+e.message+'</td></tr>'; }
  }
  async function revoke(){
    const email = document.getElementById('email').value.trim();
    try{ const r = await api('/admin/revoke', { method:'POST', body: JSON.stringify({ email }) });
      document.getElementById('revmsg').textContent = `revoked ${r.revoked} key(s) for ${email}`; load();
    }catch(e){ document.getElementById('revmsg').textContent = e.message; }
  }
</script>
