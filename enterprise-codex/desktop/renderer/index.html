<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
<title>Company Codex</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --muted:#666; --line:#e5e5e5; --accent:#2563eb; --ok:#16a34a; --card:#fafafa; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#0f1115; --fg:#e8e8e8; --muted:#9aa0aa; --line:#242833; --accent:#60a5fa; --ok:#4ade80; --card:#161922; } }
  *{ box-sizing:border-box; } body{ font:14px/1.5 system-ui,sans-serif; margin:0; background:var(--bg); color:var(--fg); }
  .wrap{ padding:22px; }
  h1{ font-size:18px; margin:0 0 2px; } .sub{ color:var(--muted); font-size:12px; margin-bottom:18px; }
  button{ font:inherit; width:100%; padding:11px; border-radius:9px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary{ background:transparent; color:var(--accent); }
  button:disabled{ opacity:.5; cursor:default; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; }
  label{ display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  input{ width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  .row{ display:flex; align-items:center; gap:10px; }
  .avatar{ width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700; }
  .log{ font:12px/1.5 ui-monospace,monospace; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; height:120px; overflow:auto; white-space:pre-wrap; color:var(--muted); }
  .pill{ font-size:11px; padding:2px 8px; border:1px solid var(--ok); color:var(--ok); border-radius:999px; }
  .link{ background:none;border:none;color:var(--accent);width:auto;padding:4px;cursor:pointer;font-size:12px; }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Company Codex</h1>
  <div class="sub">Sign in with Feishu to use Codex — zero setup.</div>

  <!-- SIGN IN -->
  <div id="signin">
    <div class="card">
      <button id="loginBtn">🔐 使用飞书登录 / Sign in with Feishu</button>
      <button class="link" id="settingsToggle" style="margin-top:8px">Settings</button>
      <div id="settings" class="hidden">
        <label>Gateway URL</label><input id="gatewayUrl" placeholder="https://gateway.corp.com" />
        <label>Bundled Codex binary (optional)</label><input id="codexBin" placeholder="/path/to/codex" />
        <button class="secondary" id="saveSettings" style="margin-top:10px">Save</button>
      </div>
    </div>
  </div>

  <!-- SIGNED IN -->
  <div id="app" class="hidden">
    <div class="card">
      <div class="row">
        <div class="avatar" id="avatar">?</div>
        <div><b id="empName"></b><br><span class="sub" id="empEmail"></span></div>
        <span style="flex:1"></span><span class="pill">provisioned</span>
      </div>
      <div class="sub" id="empSkills" style="margin-top:10px"></div>
    </div>
    <button id="launchBtn">🚀 启动 Codex / Launch Codex</button>
    <button class="link" id="logoutBtn" style="margin-top:8px">Sign out</button>
  </div>

  <div class="log" id="log" aria-live="polite"></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
